
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-app
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-app
  template:
    metadata:
      labels:
        app: rag-app
    spec:
      containers:
        - name: rag-app
          image: rag-app:latest
          imagePullPolicy: Never
          env:
            - name: QDRANT_URL
              value: "http://qdrant.platform.svc.cluster.local:6333"
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: 8000
            failureThreshold: 90      # 15 min
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: rag-app
  namespace: team-a
spec:
  selector:
    app: rag-app
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
